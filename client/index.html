<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/robot.png" type="image/png">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <script src="app.js" defer></script>

    <title>AMA-BOT</title>
</head>

<body data-theme="light">

    <header class="site-header">
        <h1 class="site-title">AMA-BOT</h1>

        <nav class="site-nav" aria-label="Main navigation">
            <button id="clear-messages-button" class="theme-toggle" type="button">
                Reset Chat
            </button>
            <button id="toggleDarkMode" class="theme-toggle" type="button">
                Dark mode
            </button>
        </nav>
    </header>

    <main class="main-content">
        <section class="chat-section">

            <h2 id="welcome-title">Velkommen til AMA-BOT</h2>

            <form id="question-form" class="question-form">
                <div class="form-group">

                    <input
                        type="text"
                        id="question"
                        name="question"
                        placeholder="Skriv dit spørgsmål her..."
                    >   
                </div>

                <button class="submit-button" type="submit">
                    Indsend
                </button>
            </form>
            <section id="messages" aria-live="polite"></section>
        </section>

    </main>
<script src="js/theme.js"></script>

</body>
</html>
